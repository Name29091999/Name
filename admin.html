<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Name - Адмін-панель</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --accent-color: #000000;
            --header-bg: #000000;
            --header-text: #ffffff;
        }

        [data-theme="grey"] {
            --bg-color: #212529;
            --text-color: #f8f9fa;
            --card-bg: #343a40;
            --border-color: #495057;
            --accent-color: #ffffff;
            --header-bg: #1a1d20;
            --header-text: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #0f1012;
            --text-color: #e3e3e3;
            --card-bg: #1b1c1e;
            --border-color: #2c2d30;
            --accent-color: #ffffff;
            --header-bg: #161719;
            --header-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-color);
        }

        .brand-title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            padding: 25px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-control, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 15px;
        }

        /* Стильные крупные чекбоксы-карточки для размеров */
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
            padding: 5px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            background-color: var(--bg-color);
            transition: all 0.2s;
        }

        .checkbox-item input {
            display: none;
        }

        .checkbox-item:has(input:checked) {
            border-color: #28a745;
            background-color: rgba(40, 167, 69, 0.15);
            color: #28a745;
        }

        .btn-submit {
            background-color: #28a745;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #218838;
        }

        /* Список товаров снизу */
        .products-list-section {
            margin-top: 40px;
            border-top: 2px solid var(--border-color);
            padding-top: 25px;
        }

        .product-card-admin {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            gap: 15px;
        }

        .product-info-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .product-thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .product-details h4 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .product-details p {
            font-size: 13px;
            opacity: 0.7;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .btn-delete:hover {
            background-color: #c82333;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100%;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            box-shadow: 5px 0 15px rgba(0,0,0,0.1);
            transition: left 0.3s ease;
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .drawer.open {
            left: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 18px;
            font-weight: bold;
        }

        .close-drawer {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-color);
        }

        .settings-group {
            margin-bottom: 20px;
        }

        .settings-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .settings-group select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
        }
    </style>
</head>
<body data-theme="dark">

    <header class="navbar">
        <div class="nav-left">
            <button class="menu-btn" onclick="toggleDrawer()">☰</button>
            <div class="brand-title">Name Admin</div>
        </div>
    </header>

    <div class="container">
        <h2 id="formHeader">Додати новий товар</h2>
        <form id="productForm" onsubmit="saveProduct(event)">
            
            <div class="form-group">
                <label id="labelTitle">Назва товару</label>
                <input type="text" id="prodTitle" class="form-control" placeholder="Наприклад: Кроссовки Nike Air Force" required>
            </div>

            <div class="form-group">
                <label id="labelArticle">Артикул (код товару)</label>
                <input type="text" id="prodArticle" class="form-control" placeholder="Наприклад: NK-AF1-001">
            </div>

            <div class="form-group">
                <label id="labelPrice">Ціна (грн)</label>
                <input type="number" id="prodPrice" class="form-control" placeholder="2500" required>
            </div>

            <div class="form-group">
                <label id="labelCat">Тип товару</label>
                <select id="prodCategory" class="form-control" onchange="updateSubcategories()" required>
                    <option value="Взуття">Взуття</option>
                    <option value="Одяг">Одяг</option>
                    <option value="Аксесуари">Аксесуари</option>
                </select>
            </div>

            <div class="form-group">
                <label id="labelSubcat">Підкатегорія</label>
                <select id="prodSubcategory" class="form-control" required></select>
            </div>

            <div class="form-group">
                <label id="labelBrand">Бренд</label>
                <select id="prodBrand" class="form-control" onchange="checkCustomBrand()" required>
                    <option value="Nike">Nike</option>
                    <option value="Adidas">Adidas</option>
                    <option value="Puma">Puma</option>
                    <option value="New Balance">New Balance</option>
                    <option value="Reebok">Reebok</option>
                    <option value="ASICS">ASICS</option>
                    <option value="Under Armour">Under Armour</option>
                    <option value="Salomon">Salomon</option>
                    <option value="Converse">Converse</option>
                    <option value="Vans">Vans</option>
                    <option value="Crocs">Crocs</option>
                    <option value="Stone Island">Stone Island</option>
                    <option value="Carhartt">Carhartt</option>
                    <option value="Levi's">Levi's</option>
                    <option value="The North Face">The North Face</option>
                    <option value="custom">Свій варіант (ввести вручну)...</option>
                </select>
            </div>

            <div class="form-group" id="customBrandGroup" style="display: none;">
                <label id="labelCustomBrand">Введіть свій бренд</label>
                <input type="text" id="prodCustomBrand" class="form-control" placeholder="Введіть назву бренду">
            </div>

            <div class="form-group">
                <label id="labelSizes">Виберіть доступні розміри</label>
                <div class="checkbox-grid" id="sizesContainer"></div>
            </div>

            <div class="form-group">
                <label id="labelImages">Вибрати фото з галереї (можна кілька)</label>
                <input type="file" id="prodImagesFile" class="form-control" accept="image/*" multiple>
            </div>

            <div class="form-group">
                <label id="labelTg">Посилання для замовлення в Telegram</label>
                <input type="text" id="prodTg" class="form-control" placeholder="https://t.me/your_username">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Зберегти товар</button>
        </form>

        <div class="products-list-section">
            <h3 id="listHeader" style="margin-bottom: 15px; font-size: 18px;">Список доданих товарів</h3>
            <div id="adminProductsContainer">
                <p style="opacity: 0.6; text-align: center;" id="loadingText">Завантаження товарів...</p>
            </div>
        </div>
    </div>

    <div class="drawer" id="settingsDrawer">
        <div class="drawer-header">
            <span id="settingsTitle">Налаштування</span>
            <button class="close-drawer" onclick="toggleDrawer()">×</button>
        </div>
        <div class="settings-group">
            <label id="langLabel">Мова / Language</label>
            <select id="langSelect" onchange="changeLanguage(this.value)">
                <option value="ua">Українська</option>
                <option value="ru">Русский</option>
                <option value="en">English</option>
                <option value="be">Беларуская</option>
                <option value="zh">中文 (Chinese)</option>
            </select>
        </div>
        <div class="settings-group">
            <label id="themeLabel">Тема оформлення</label>
            <select id="themeSelect" onchange="changeTheme(this.value)">
                <option value="dark" id="themeDark">Тёмная</option>
                <option value="grey" id="themeGrey">Серая</option>
                <option value="light" id="themeLight">Светлая</option>
            </select>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://bxqfolxpvnxlsmsuleq.supabase.co';
        const supabaseKey = 'sb_publishable_D4iYQCa8sNLO44YMWvrVv_El1RCApF'; // Исправлен один символ с '0' на '8'
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        const subcategoriesData = {
            "Взуття": ["Кроссовки", "Кеди", "Босоніжки", "Тапки", "Шльопанці", "Черевики", "Мокасини"],
            "Одяг": ["Худі / Свитшоты", "Футболки", "Штани / Джинси", "Куртки / Пуховики", "Шорти", "Спортивні костюми", "Кофти"],
            "Аксесуари": ["Сумки / Рюкзаки", "Кепки / Шапки", "Годинники", "Ремені", "Окуляри", "Прикраси"]
        };

        const translations = {
            ua: {
                title: "Name - Адмін-панель",
                header: "Додати новий товар",
                lblTitle: "Назва товару",
                lblArticle: "Артикул (код товару)",
                lblPrice: "Ціна (грн)",
                lblCat: "Тип товару",
                lblSubcat: "Підкатегорія",
                lblBrand: "Бренд",
                lblCustomBrand: "Введіть свій бренд",
                lblSizes: "Виберіть доступні розміри",
                lblImages: "Вибрати фото з галереї (можна кілька)",
                lblTg: "Посилання для замовлення в Telegram",
                submit: "Зберегти товар",
                success: "Товар успішно додано!",
                settings: "Налаштування",
                lang: "Мова / Language",
                theme: "Тема оформлення",
                dark: "Тёмная",
                grey: "Серая",
                light: "Светлая",
                listHeader: "Список доданих товарів",
                loading: "Завантаження товарів...",
                delBtn: "Видалити"
            },
            ru: {
                title: "Name - Админ-панель",
                header: "Добавить новый товар",
                lblTitle: "Название товара",
                lblArticle: "Артикул (код товара)",
                lblPrice: "Цена (грн)",
                lblCat: "Тип товара",
                lblSubcat: "Подкатегория",
                lblBrand: "Бренд",
                lblCustomBrand: "Введите свой бренд",
                lblSizes: "Выберите доступные размеры",
                lblImages: "Выбрать фото из галереи (можно несколько)",
                lblTg: "Ссылка для заказа в Telegram",
                submit: "Сохранить товар",
                success: "Товар успешно добавлен!",
                settings: "Настройки",
                lang: "Язык / Language",
                theme: "Тема оформления",
                dark: "Тёмная",
                grey: "Серая",
                light: "Светлая",
                listHeader: "Список добавленных товаров",
                loading: "Загрузка товаров...",
                delBtn: "Удалить"
            },
            en: {
                title: "Name - Admin Panel",
                header: "Add New Product",
                lblTitle: "Product Name",
                lblArticle: "Article / SKU",
                lblPrice: "Price (UAH)",
                lblCat: "Category",
                lblSubcat: "Subcategory",
                lblBrand: "Brand",
                lblCustomBrand: "Enter custom brand",
                lblSizes: "Select available sizes",
                lblImages: "Choose photos from gallery",
                lblTg: "Telegram order link",
                submit: "Save Product",
                success: "Product successfully added!",
                settings: "Settings",
                lang: "Language",
                theme: "Theme",
                dark: "Dark",
                grey: "Grey",
                light: "Light",
                listHeader: "Added Products List",
                loading: "Loading products...",
                delBtn: "Delete"
            }
        };

        function updateSubcategories() {
            const cat = document.getElementById('prodCategory').value;
            const subContainer = document.getElementById('prodSubcategory');
            subContainer.innerHTML = '';
            
            if (subcategoriesData[cat]) {
                subcategoriesData[cat].forEach(sub => {
                    subContainer.innerHTML += `<option value="${sub}">${sub}</option>`;
                });
            }
            updateSizesCheckboxes();
        }

        function updateSizesCheckboxes() {
            const cat = document.getElementById('prodCategory').value;
            const sizesContainer = document.getElementById('sizesContainer');
            sizesContainer.innerHTML = '';

            if (cat === "Взуття") {
                for (let i = 35; i <= 46.5; i += 0.5) {
                    sizesContainer.innerHTML += `
                        <label class="checkbox-item">
                            <input type="checkbox" value="${i}"> ${i}
                        </label>`;
                }
            } else {
                ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL', 'XXXL'].forEach(s => {
                    sizesContainer.innerHTML += `
                        <label class="checkbox-item">
                            <input type="checkbox" value="${s}"> ${s}
                        </label>`;
                });
            }
        }

        function checkCustomBrand() {
            const brand = document.getElementById('prodBrand').value;
            const customGroup = document.getElementById('customBrandGroup');
            if (brand === 'custom') {
                customGroup.style.display = 'block';
            } else {
                customGroup.style.display = 'none';
            }
        }

        function toggleDrawer() {
            document.getElementById('settingsDrawer').classList.toggle('open');
        }

        function changeTheme(theme) {
            document.body.setAttribute('data-theme', theme);
        }

        function changeLanguage(lang) {
            const t = translations[lang] || translations.ua;
            document.getElementById('pageTitle').textContent = t.title;
            document.getElementById('formHeader').textContent = t.header;
            document.getElementById('labelTitle').textContent = t.lblTitle;
            document.getElementById('labelArticle').textContent = t.lblArticle;
            document.getElementById('labelPrice').textContent = t.lblPrice;
            document.getElementById('labelCat').textContent = t.lblCat;
            document.getElementById('labelSubcat').textContent = t.lblSubcat;
            document.getElementById('labelBrand').textContent = t.lblBrand;
            document.getElementById('labelCustomBrand').textContent = t.lblCustomBrand;
            document.getElementById('labelSizes').textContent = t.lblSizes;
            document.getElementById('labelImages').textContent = t.lblImages;
            document.getElementById('labelTg').textContent = t.lblTg;
            document.getElementById('submitBtn').textContent = t.submit;
            document.getElementById('listHeader').textContent = t.listHeader;
            
            document.getElementById('settingsTitle').textContent = t.settings;
            document.getElementById('langLabel').textContent = t.lang;
            document.getElementById('themeLabel').textContent = t.theme;
            document.getElementById('themeDark').textContent = t.dark;
            document.getElementById('themeGrey').textContent = t.grey;
            document.getElementById('themeLight').textContent = t.light;
            loadProductsList();
        }

        async function convertFilesToBasePath(files) {
            let promises = Array.from(files).map(file => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.onerror = error => reject(error);
                    reader.readAsDataURL(file);
                });
            });
            return Promise.all(promises);
        }

        async function saveProduct(event) {
            event.preventDefault();
            const lang = document.getElementById('langSelect').value;
            const t = translations[lang] || translations.ua;

            const title = document.getElementById('prodTitle').value.trim();
            const article = document.getElementById('prodArticle').value.trim();
            const price = parseFloat(document.getElementById('prodPrice').value);
            const category = document.getElementById('prodCategory').value;
            const subcategory = document.getElementById('prodSubcategory').value;
            
            let brand = document.getElementById('prodBrand').value;
            if (brand === 'custom') {
                brand = document.getElementById('prodCustomBrand').value.trim() || 'Інше';
            }
            
            const selectedSizes = Array.from(document.querySelectorAll('#sizesContainer input:checked')).map(cb => cb.value);
            
            const filesInput = document.getElementById('prodImagesFile');
            let images = [];
            if (filesInput.files.length > 0) {
                images = await convertFilesToBasePath(filesInput.files);
            }

            const tg_link = document.getElementById('prodTg').value.trim();

            const { error } = await supabaseClient.from('products').insert([
                { title, article, price, category, subcategory, brand, sizes: selectedSizes, images, tg_link }
            ]);

            if (error) {
                alert('Помилка збереження: ' + error.message);
                console.error(error);
            } else {
                alert(t.success);
                document.getElementById('productForm').reset();
                document.getElementById('customBrandGroup').style.display = 'none';
                updateSubcategories();
                loadProductsList();
            }
        }

        async function loadProductsList() {
            const lang = document.getElementById('langSelect').value;
            const t = translations[lang] || translations.ua;
            const container = document.getElementById('adminProductsContainer');
            container.innerHTML = `<p style="opacity: 0.6; text-align: center;">${t.loading}</p>`;

            const { data: products, error } = await supabaseClient
                .from('products')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                container.innerHTML = `<p style="color: red;">Помилка завантаження</p>`;
                return;
            }

            if (!products || products.length === 0) {
                container.innerHTML = `<p style="opacity: 0.6; text-align: center;">Товарів поки немає</p>`;
                return;
            }

            container.innerHTML = '';
            products.forEach(p => {
                let thumb = (p.images && p.images.length > 0) ? p.images[0] : 'https://via.placeholder.com/50';
                let artText = p.article ? `Артикул: ${p.article}` : '';
                container.innerHTML += `
                    <div class="product-card-admin">
                        <div class="product-info-left">
                            <img src="${thumb}" class="product-thumb" alt="img">
                            <div class="product-details">
                                <h4>${p.title}</h4>
                                <p>${p.brand} • <b>${p.price} грн</b> • ${p.category} / ${p.subcategory} ${artText ? '• ' + artText : ''}</p>
                            </div>
                        </div>
                        <button class="btn-delete" onclick="deleteProduct(${p.id})">${t.delBtn}</button>
                    </div>
                `;
            });
        }

        async function deleteProduct(id) {
            if (!confirm("Ви впевнені, що хочете видалити цей товар?")) return;
            const { error } = await supabaseClient.from('products').delete().eq('id', id);
            if (error) {
                alert("Помилка видалення: " + error.message);
            } else {
                loadProductsList();
            }
        }

        window.onload = () => {
            updateSubcategories();
            loadProductsList();
        };
    </script>
</body>
</html>
