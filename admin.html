<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Name - Адмін-панель</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --accent-color: #000000;
            --header-bg: #000000;
            --header-text: #ffffff;
        }

        [data-theme="grey"] {
            --bg-color: #212529;
            --text-color: #f8f9fa;
            --card-bg: #343a40;
            --border-color: #495057;
            --accent-color: #ffffff;
            --header-bg: #1a1d20;
            --header-text: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #0f1012;
            --text-color: #e3e3e3;
            --card-bg: #1b1c1e;
            --border-color: #2c2d30;
            --accent-color: #ffffff;
            --header-bg: #161719;
            --header-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-color);
        }

        .brand-title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 25px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 15px;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            background-color: var(--bg-color);
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-item input {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .btn-submit {
            background-color: #28a745;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #218838;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100%;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            box-shadow: 5px 0 15px rgba(0,0,0,0.1);
            transition: left 0.3s ease;
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .drawer.open {
            left: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 18px;
            font-weight: bold;
        }

        .close-drawer {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-color);
        }

        .settings-group {
            margin-bottom: 20px;
        }

        .settings-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .settings-group select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
        }
    </style>
</head>
<body data-theme="dark">

    <header class="navbar">
        <div class="nav-left">
            <button class="menu-btn" onclick="toggleDrawer()">☰</button>
            <div class="brand-title">Name Admin</div>
        </div>
    </header>

    <div class="container">
        <h2 id="formHeader">Додати новий товар</h2>
        <form id="productForm" onsubmit="saveProduct(event)">
            
            <div class="form-group">
                <label id="labelTitle">Назва товару</label>
                <input type="text" id="prodTitle" class="form-control" placeholder="Наприклад: Кроссовки Nike Air Force" required>
            </div>

            <div class="form-group">
                <label id="labelPrice">Ціна (грн)</label>
                <input type="number" id="prodPrice" class="form-control" placeholder="2500" required>
            </div>

            <div class="form-group">
                <label id="labelCat">Тип товару</label>
                <select id="prodCategory" class="form-control" onchange="updateSubcategories()" required>
                    <option value="Взуття">Взуття</option>
                    <option value="Одяг">Одяг</option>
                    <option value="Аксесуари">Аксесуари</option>
                </select>
            </div>

            <div class="form-group">
                <label id="labelSubcat">Підкатегорія</label>
                <select id="prodSubcategory" class="form-control" required></select>
            </div>

            <div class="form-group">
                <label id="labelBrand">Бренд</label>
                <select id="prodBrand" class="form-control" required>
                    <option value="Nike">Nike</option>
                    <option value="Adidas">Adidas</option>
                    <option value="Puma">Puma</option>
                    <option value="New Balance">New Balance</option>
                    <option value="Reebok">Reebok</option>
                    <option value="ASICS">ASICS</option>
                    <option value="Under Armour">Under Armour</option>
                    <option value="Salomon">Salomon</option>
                    <option value="Converse">Converse</option>
                    <option value="Vans">Vans</option>
                    <option value="Crocs">Crocs</option>
                    <option value="Stone Island">Stone Island</option>
                    <option value="Carhartt">Carhartt</option>
                    <option value="Levi's">Levi's</option>
                    <option value="The North Face">The North Face</option>
                    <option value="Інше">Інше / Друге</option>
                </select>
            </div>

            <div class="form-group">
                <label id="labelSizes">Виберіть доступні розміри</label>
                <div class="checkbox-grid" id="sizesContainer"></div>
            </div>

            <div class="form-group">
                <label id="labelImages">Посилання на фото (через кому, якщо кілька)</label>
                <input type="text" id="prodImages" class="form-control" placeholder="https://site.com/photo1.jpg, https://site.com/photo2.jpg">
            </div>

            <div class="form-group">
                <label id="labelTg">Посилання для замовлення в Telegram</label>
                <input type="text" id="prodTg" class="form-control" placeholder="https://t.me/your_username">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Зберегти товар</button>
        </form>
    </div>

    <div class="drawer" id="settingsDrawer">
        <div class="drawer-header">
            <span id="settingsTitle">Налаштування</span>
            <button class="close-drawer" onclick="toggleDrawer()">×</button>
        </div>
        <div class="settings-group">
            <label id="langLabel">Мова / Language</label>
            <select id="langSelect" onchange="changeLanguage(this.value)">
                <option value="ua">Українська</option>
                <option value="ru">Русский</option>
                <option value="en">English</option>
                <option value="be">Беларуская</option>
                <option value="zh">中文 (Chinese)</option>
            </select>
        </div>
        <div class="settings-group">
            <label id="themeLabel">Тема оформлення</label>
            <select id="themeSelect" onchange="changeTheme(this.value)">
                <option value="dark" id="themeDark">Тёмная</option>
                <option value="grey" id="themeGrey">Серая</option>
                <option value="light" id="themeLight">Светлая</option>
            </select>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://bxqfolxpnxlsmsuleq.supabase.co';
        const supabaseKey = 'sb_publishable_D4IyQCa0sNLO44YWVmRvYw_E1lRCAPF';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        const subcategoriesData = {
            "Взуття": ["Кроссовки", "Кеди", "Босоніжки", "Тапки", "Шльопанці", "Черевики", "Мокасини"],
            "Одяг": ["Худі / Свитшоты", "Футболки", "Штани / Джинси", "Куртки / Пуховики", "Шорти", "Спортивні костюми", "Кофти"],
            "Аксесуари": ["Сумки / Рюкзаки", "Кепки / Шапки", "Годинники", "Ремені", "Окуляри", "Прикраси"]
        };

        const translations = {
            ua: {
                title: "Name - Адмін-панель",
                header: "Додати новий товар",
                lblTitle: "Назва товару",
                lblPrice: "Ціна (грн)",
                lblCat: "Тип товару",
                lblSubcat: "Підкатегорія",
                lblBrand: "Бренд",
                lblSizes: "Виберіть доступні розміри",
                lblImages: "Посилання на фото (через кому, якщо кілька)",
                lblTg: "Посилання для замовлення в Telegram",
                submit: "Зберегти товар",
                success: "Товар успішно додано!",
                settings: "Налаштування",
                lang: "Мова / Language",
                theme: "Тема оформлення",
                dark: "Тёмная",
                grey: "Серая",
                light: "Светлая"
            },
            ru: {
                title: "Name - Админ-панель",
                header: "Добавить новый товар",
                lblTitle: "Название товара",
                lblPrice: "Цена (грн)",
                lblCat: "Тип товара",
                lblSubcat: "Подкатегория",
                lblBrand: "Бренд",
                lblSizes: "Выберите доступные размеры",
                lblImages: "Ссылки на фото (через запятую)",
                lblTg: "Ссылка для заказа в Telegram",
                submit: "Сохранить товар",
                success: "Товар успешно добавлен!",
                settings: "Настройки",
                lang: "Язык / Language",
                theme: "Тема оформления",
                dark: "Тёмная",
                grey: "Серая",
                light: "Светлая"
            },
            en: {
                title: "Name - Admin Panel",
                header: "Add New Product",
                lblTitle: "Product Name",
                lblPrice: "Price (UAH)",
                lblCat: "Category",
                lblSubcat: "Subcategory",
                lblBrand: "Brand",
                lblSizes: "Select available sizes",
                lblImages: "Image URLs (comma separated)",
                lblTg: "Telegram order link",
                submit: "Save Product",
                success: "Product successfully added!",
                settings: "Settings",
                lang: "Language",
                theme: "Theme",
                dark: "Dark",
                grey: "Grey",
                light: "Light"
            },
            be: {
                title: "Name - Адмін-панэль",
                header: "Дадаць новы тавар",
                lblTitle: "Назва тавара",
                lblPrice: "Кошт (грн)",
                lblCat: "Тып тавара",
                lblSubcat: "Падкатэгорыя",
                lblBrand: "Брэнд",
                lblSizes: "Выберыце даступныя памеры",
                lblImages: "Спасылкі на фота",
                lblTg: "Спасылка для замовы ў Telegram",
                submit: "Захаваць тавар",
                success: "Тавар паспяхова дададзены!",
                settings: "Налады",
                lang: "Мова / Language",
                theme: "Тэма афармлення",
                dark: "Цёмная",
                grey: "Шэрая",
                light: "Светлая"
            },
            zh: {
                title: "Name - 管理面板",
                header: "添加新商品",
                lblTitle: "商品名称",
                lblPrice: "价格 (UAH)",
                lblCat: "商品类型",
                lblSubcat: "子类别",
                lblBrand: "品牌",
                lblSizes: "选择可用尺寸",
                lblImages: "图片链接 (逗号分隔)",
                lblTg: "Telegram 订购链接",
                submit: "保存商品",
                success: "商品添加成功！",
                settings: "设置",
                lang: "语言 / Language",
                theme: "主题",
                dark: "深色",
                grey: "灰色",
                light: "浅色"
            }
        };

        function updateSubcategories() {
            const cat = document.getElementById('prodCategory').value;
            const subContainer = document.getElementById('prodSubcategory');
            subContainer.innerHTML = '';
            
            if (subcategoriesData[cat]) {
                subcategoriesData[cat].forEach(sub => {
                    subContainer.innerHTML += `<option value="${sub}">${sub}</option>`;
                });
            }
            updateSizesCheckboxes();
        }

        function updateSizesCheckboxes() {
            const cat = document.getElementById('prodCategory').value;
            const sizesContainer = document.getElementById('sizesContainer');
            sizesContainer.innerHTML = '';

            if (cat === "Взуття") {
                for (let i = 35; i <= 46.5; i += 0.5) {
                    sizesContainer.innerHTML += `
                        <label class="checkbox-item">
                            <input type="checkbox" value="${i}"> ${i}
                        </label>`;
                }
            } else {
                ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL', 'XXXL'].forEach(s => {
                    sizesContainer.innerHTML += `
                        <label class="checkbox-item">
                            <input type="checkbox" value="${s}"> ${s}
                        </label>`;
                });
            }
        }

        function toggleDrawer() {
            document.getElementById('settingsDrawer').classList.toggle('open');
        }

        function changeTheme(theme) {
            document.body.setAttribute('data-theme', theme);
        }

        function changeLanguage(lang) {
            const t = translations[lang] || translations.ua;
            document.getElementById('pageTitle').textContent = t.title;
            document.getElementById('formHeader').textContent = t.header;
            document.getElementById('labelTitle').textContent = t.lblTitle;
            document.getElementById('labelPrice').textContent = t.lblPrice;
            document.getElementById('labelCat').textContent = t.lblCat;
            document.getElementById('labelSubcat').textContent = t.lblSubcat;
            document.getElementById('labelBrand').textContent = t.lblBrand;
            document.getElementById('labelSizes').textContent = t.lblSizes;
            document.getElementById('labelImages').textContent = t.lblImages;
            document.getElementById('labelTg').textContent = t.lblTg;
            document.getElementById('submitBtn').textContent = t.submit;
            
            document.getElementById('settingsTitle').textContent = t.settings;
            document.getElementById('langLabel').textContent = t.lang;
            document.getElementById('themeLabel').textContent = t.theme;
            document.getElementById('themeDark').textContent = t.dark;
            document.getElementById('themeGrey').textContent = t.grey;
            document.getElementById('themeLight').textContent = t.light;
        }

        async function saveProduct(event) {
            event.preventDefault();
            const lang = document.getElementById('langSelect').value;
            const t = translations[lang] || translations.ua;

            const title = document.getElementById('prodTitle').value.trim();
            const price = parseFloat(document.getElementById('prodPrice').value);
            const category = document.getElementById('prodCategory').value;
            const subcategory = document.getElementById('prodSubcategory').value;
            const brand = document.getElementById('prodBrand').value;
            
            const selectedSizes = Array.from(document.querySelectorAll('#sizesContainer input:checked')).map(cb => cb.value);
            
            const imagesRaw = document.getElementById('prodImages').value.trim();
            const images = imagesRaw ? imagesRaw.split(',').map(s => s.trim()) : [];
            const tg_link = document.getElementById('prodTg').value.trim();

            const { error } = await supabaseClient.from('products').insert([
                { title, price, category, subcategory, brand, sizes: selectedSizes, images, tg_link }
            ]);

            if (error) {
                alert('Помилка збереження: ' + error.message);
                console.error(error);
            } else {
                alert(t.success);
                document.getElementById('productForm').reset();
                updateSubcategories();
            }
        }

        window.onload = () => {
            updateSubcategories();
        };
    </script>
</body>
</html>
