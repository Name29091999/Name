    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --accent-color: #000000;
            --header-bg: #000000;
            --header-text: #ffffff;
        }

        [data-theme="grey"] {
            --bg-color: #212529;
            --text-color: #f8f9fa;
            --card-bg: #343a40;
            --border-color: #495057;
            --accent-color: #ffffff;
            --header-bg: #1a1d20;
            --header-text: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #0f1012;
            --text-color: #e3e3e3;
            --card-bg: #1b1c1e;
            --border-color: #2c2d30;
            --accent-color: #ffffff;
            --header-bg: #161719;
            --header-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
        }

        .marquee-container {
            background-color: var(--header-bg);
            color: var(--header-text);
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            height: 35px;
            display: flex;
            align-items: center;
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 14px;
        }

        .marquee-track {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 15s linear infinite;
            will-change: transform;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-color);
        }

        .brand-title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .hero-section {
            width: 100%;
            height: 500px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            filter: brightness(0.7);
        }

        .hero-title {
            position: relative;
            z-index: 2;
            font-size: 42px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            background: linear-gradient(90deg, #ffffff, #000000, #ffffff, #000000);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineGradient 4s linear infinite;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        @keyframes shineGradient {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        .search-filter-bar {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 16px;
        }

        .filter-open-btn {
            padding: 0 20px;
            background-color: var(--accent-color);
            color: var(--header-text);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100%;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            box-shadow: 5px 0 15px rgba(0,0,0,0.1);
            transition: left 0.3s ease;
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .drawer.open {
            left: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 18px;
            font-weight: bold;
        }

        .close-drawer {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-color);
        }

        .settings-group {
            margin-bottom: 20px;
        }

        .settings-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .settings-group select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .filter-panel {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            padding: 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            display: none;
        }

        .filter-panel.active {
            display: block;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .filter-column h4 {
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }

        .checkbox-list {
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Красивые крупные чекбоксы */
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            cursor: pointer;
            user-select: none;
            padding: 4px 0;
        }

        .checkbox-item input {
            position: absolute;
            opacity: 0.01;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .custom-checkbox {
            position: relative;
            height: 20px;
            width: 20px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .checkbox-item:hover input ~ .custom-checkbox {
            border-color: var(--accent-color);
        }

        .checkbox-item input:checked ~ .custom-checkbox {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .custom-checkbox:after {
            content: "";
            position: absolute;
            display: none;
        }

        .checkbox-item input:checked ~ .custom-checkbox:after {
            display: block;
        }

        .checkbox-item .custom-checkbox:after {
            left: 6px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid var(--header-text);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .filter-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .btn-apply {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-reset {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px 40px 15px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
        }

        .product-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #eee;
        }

        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-brand {
            font-size: 12px;
            text-transform: uppercase;
            opacity: 0.6;
            margin-bottom: 5px;
        }

        .product-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 18px;
            font-weight: bold;
            margin-top: auto;
            margin-bottom: 10px;
        }

        .product-tg-btn {
            display: inline-block;
            text-align: center;
            background-color: #0088cc;
            color: white;
            padding: 8px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>

        function initDynamicContent() {
            const track = document.getElementById('marqueeTrack');
            track.innerHTML = track.innerHTML.repeat(3);
            updateDynamicLists();
        }

        function getSelectedCategories() {
            const checkboxes = document.querySelectorAll('#categoryCheckboxes input[type="checkbox"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        function updateDynamicLists() {
            const selectedCats = getSelectedCategories();
            
            // Динамические подкатегории
            const subContainer = document.getElementById('subcategoryCheckboxes');
            const previouslyCheckedSubs = Array.from(subContainer.querySelectorAll('input:checked')).map(cb => cb.value);
            subContainer.innerHTML = '';
            
            let subsToShow = new Set();
            if (selectedCats.length === 0) {
                Object.values(subcategoriesData).forEach(arr => arr.forEach(sub => subsToShow.add(sub)));
            } else {
                selectedCats.forEach(cat => {
                    if (subcategoriesData[cat]) {
                        subcategoriesData[cat].forEach(sub => subsToShow.add(sub));
                    }
                });
            }

            subsToShow.forEach(sub => {
                let isChecked = previouslyCheckedSubs.includes(sub) ? 'checked' : '';
                subContainer.innerHTML += `
                    <label class="checkbox-item">
                        <input type="checkbox" value="${sub}" ${isChecked}><span class="custom-checkbox"></span> ${sub}
                    </label>`;
            });

            // Динамические размеры (обувные или буквенные в зависимости от выбора)
            const sizeContainer = document.getElementById('sizeCheckboxes');
            const previouslyCheckedSizes = Array.from(sizeContainer.querySelectorAll('input:checked')).map(cb => cb.value);
            sizeContainer.innerHTML = '';

            let showShoesSizes = selectedCats.length === 0 || selectedCats.includes("Взуття");
            let showClothSizes = selectedCats.length === 0 || selectedCats.includes("Одяг") || selectedCats.includes("Аксесуари");

            if (showShoesSizes) {
                for (let i = 35; i <= 46.5; i += 0.5) {
                    let val = i.toString();
                    let isChecked = previouslyCheckedSizes.includes(val) ? 'checked' : '';
                    sizeContainer.innerHTML += `
                        <label class="checkbox-item">
                            <input type="checkbox" value="${val}" ${isChecked}><span class="custom-checkbox"></span> ${val}
                        </label>`;
                }
            }
            if (showClothSizes) {
                ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL', 'XXXL'].forEach(s => {
                    let isChecked = previouslyCheckedSizes.includes(s) ? 'checked' : '';
                    sizeContainer.innerHTML += `
                        <label class="checkbox-item">
                            <input type="checkbox" value="${s}" ${isChecked}><span class="custom-checkbox"></span> ${s}
                        </label>`;
                });
            }
        }

        function onCategoryChange() {
            updateDynamicLists();
            applyFilters();
        }

        async function fetchProducts() {
            const { data, error } = await supabaseClient.from('products').select('*');
            if (error) {
                console.error('Помилка завантаження:', error);
                return;
            }
            allProducts = data || [];
            renderProducts(allProducts);
            updateCounters(allProducts.length);
        }

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            const lang = document.getElementById('langSelect').value;
            const t = translations[lang] || translations.ua;

            if (products.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; padding: 40px;">${t.noProducts}</p>`;
                return;
            }

            products.forEach(p => {
                let imgUrl = p.images && p.images.length > 0 ? p.images[0] : 'https://via.placeholder.com/250';
                let card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${imgUrl}" alt="${p.title}" class="product-img">
                    <div class="product-info">
                        <div class="product-brand">${p.brand || ''}</div>
                        <div class="product-title">${p.title}</div>
                        <div class="product-price">${p.price} грн</div>
                        ${p.tg_link ? `<a href="${p.tg_link}" target="_blank" class="product-tg-btn">${t.orderBtn}</a>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleDrawer() {
            document.getElementById('settingsDrawer').classList.toggle('open');
        }

        function toggleFilterPanel() {
            document.getElementById('filterPanel').classList.toggle('active');
        }

        function changeTheme(theme) {
            document.body.setAttribute('data-theme', theme);
        }

        function changeLanguage(lang) {
            const t = translations[lang] || translations.ua;
            
            document.getElementById('pageTitle').textContent = t.title;
            document.getElementById('heroText').textContent = t.hero;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('filterBtnText').textContent = t.filters;
            document.getElementById('catTitle').textContent = t.catTitle;
            document.getElementById('subcatTitle').textContent = t.subcatTitle;
            document.getElementById('brandTitle').textContent = t.brandTitle;
            document.getElementById('sizeTitle').textContent = t.sizeTitle;
            document.getElementById('resetBtnText').textContent = t.reset;
            
            document.getElementById('settingsTitle').textContent = t.settings;
            document.getElementById('langLabel').textContent = t.lang;
            document.getElementById('themeLabel').textContent = t.theme;
            document.getElementById('themeDark').textContent = t.dark;
            document.getElementById('themeGrey').textContent = t.grey;
            document.getElementById('themeLight').textContent = t.light;

            document.querySelector('.cat-shoe').textContent = t.shoe;
            document.querySelector('.cat-cloth').textContent = t.cloth;
            document.querySelector('.cat-acc').textContent = t.acc;
            document.querySelector('.brand-other').textContent = t.otherBrand;

            updateCounters(allProducts.length);
            renderProducts(allProducts);
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => 
                (p.title && p.title.toLowerCase().includes(query)) || 
                (p.brand && p.brand.toLowerCase().includes(query))
            );
            renderProducts(filtered);
            updateCounters(filtered.length);
        }

        function updateCounters(count) {
            const lang = document.getElementById('langSelect').value;
            const t = translations[lang] || translations.ua;
            document.getElementById('productCounter').textContent = `${t.found}${count}`;
            document.querySelector('.btn-apply span').textContent = count;
        }

        function getCheckedValues(containerId) {
            const checkboxes = document.querySelectorAll(`#${containerId} input[type="checkbox"]:checked`);
            return Array.from(checkboxes).map(cb => cb.value);
        }

        function applyFilters() {
            const selectedCategories = getCheckedValues('categoryCheckboxes');
            const selectedSubcategories = getCheckedValues('subcategoryCheckboxes');
            const selectedBrands = getCheckedValues('brandCheckboxes');
            const selectedSizes = getCheckedValues('sizeCheckboxes');

            const filtered = allProducts.filter(p => {
                let matchCat = selectedCategories.length === 0 || (p.category && selectedCategories.includes(p.category));
                let matchSub = selectedSubcategories.length === 0 || (p.subcategory && selectedSubcategories.includes(p.subcategory));
                let matchBrand = selectedBrands.length === 0 || (p.brand && selectedBrands.includes(p.brand));
                
                let matchSize = true;
                if (selectedSizes.length > 0) {
                    matchSize = p.sizes && selectedSizes.some(s => p.sizes.includes(s));
                }

                return matchCat && matchSub && matchBrand && matchSize;
            });

            renderProducts(filtered);
            updateCounters(filtered.length);
        }

        function resetFilters() {
            document.querySelectorAll('.filter-panel input[type="checkbox"]').forEach(cb => cb.checked = false);
            document.getElementById('searchInput').value = '';
            updateDynamicLists();
            renderProducts(allProducts);
            updateCounters(allProducts.length);
        }

        window.onload = () => {
            initDynamicContent();
            fetchProducts();
        };
    </script>
</body>
</html>
