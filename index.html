<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name - Інтернет-магазин</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --accent-color: #000000;
            --header-bg: #000000;
            --header-text: #ffffff;
        }

        [data-theme="grey"] {
            --bg-color: #212529;
            --text-color: #f8f9fa;
            --card-bg: #343a40;
            --border-color: #495057;
            --accent-color: #ffffff;
            --header-bg: #1a1d20;
            --header-text: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #0f1012;
            --text-color: #e3e3e3;
            --card-bg: #1b1c1e;
            --border-color: #2c2d30;
            --accent-color: #ffffff;
            --header-bg: #161719;
            --header-text: #ffffff;
        }

        [data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #000000;
            --card-bg: #fdfdfd;
            --border-color: #ced4da;
            --accent-color: #000000;
            --header-bg: #000000;
            --header-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
        }

        /* Marquee Header */
        .marquee-container {
            background-color: var(--header-bg);
            color: var(--header-text);
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            height: 35px;
            display: flex;
            align-items: center;
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 14px;
        }

        .marquee-track {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 25s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Top Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-color);
        }

        .brand-title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Hero Section */
        .hero-section {
            width: 100%;
            height: 400px;
            position: relative;
            overflow: hidden;
        }

        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.85);
        }

        /* Search & Filter Bar */
        .search-filter-bar {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 16px;
        }

        .filter-open-btn {
            padding: 0 20px;
            background-color: var(--accent-color);
            color: var(--header-text);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Drawer Sidebar */
        .drawer {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100%;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            box-shadow: 5px 0 15px rgba(0,0,0,0.1);
            transition: left 0.3s ease;
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .drawer.open {
            left: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 18px;
            font-weight: bold;
        }

        .close-drawer {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-color);
        }

        .settings-group {
            margin-bottom: 20px;
        }

        .settings-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .settings-group select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* Filter Modal / Panel */
        .filter-panel {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            padding: 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            display: none;
        }

        .filter-panel.active {
            display: block;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .filter-item label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: var(--text-color);
            opacity: 0.8;
        }

        .filter-item select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .filter-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .btn-apply {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-reset {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Products Grid */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px 40px 15px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
        }

        .product-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #eee;
        }

        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-brand {
            font-size: 12px;
            text-transform: uppercase;
            opacity: 0.6;
            margin-bottom: 5px;
        }

        .product-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 18px;
            font-weight: bold;
            margin-top: auto;
            margin-bottom: 10px;
        }

        .product-tg-btn {
            display: inline-block;
            text-align: center;
            background-color: #0088cc;
            color: white;
            padding: 8px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body data-theme="dark">

    <!-- Marquee -->
    <div class="marquee-container">
        <div class="marquee-track">
            NAME &nbsp;&nbsp;&nbsp;&nbsp; NAME &nbsp;&nbsp;&nbsp;&nbsp; NAME &nbsp;&nbsp;&nbsp;&nbsp; NAME &nbsp;&nbsp;&nbsp;&nbsp; NAME &nbsp;&nbsp;&nbsp;&nbsp; NAME &nbsp;&nbsp;&nbsp;&nbsp; NAME &nbsp;&nbsp;&nbsp;&nbsp; NAME &nbsp;&nbsp;&nbsp;&nbsp; NAME &nbsp;&nbsp;&nbsp;&nbsp; NAME &nbsp;&nbsp;&nbsp;&nbsp;
            NAME &nbsp;&nbsp;&nbsp;&nbsp; NAME &nbsp;&nbsp;&nbsp;&nbsp; NAME &nbsp;&nbsp;&nbsp;&nbsp; NAME &nbsp;&nbsp;&nbsp;&nbsp; NAME &nbsp;&nbsp;&nbsp;&nbsp; NAME &nbsp;&nbsp;&nbsp;&nbsp; NAME &nbsp;&nbsp;&nbsp;&nbsp; NAME &nbsp;&nbsp;&nbsp;&nbsp; NAME &nbsp;&nbsp;&nbsp;&nbsp; NAME &nbsp;&nbsp;&nbsp;&nbsp;
        </div>
    </div>

    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-left">
            <button class="menu-btn" onclick="toggleDrawer()">☰</button>
            <div class="brand-title">Name</div>
        </div>
    </header>

    <!-- Hero Image -->
    <section class="hero-section">
        <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=1920&q=80" alt="Hero Store" class="hero-img">
    </section>

    <!-- Search & Filter Trigger -->
    <div class="search-filter-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Пошук за назвою або артикулом..." oninput="filterProducts()">
        <button class="filter-open-btn" onclick="toggleFilterPanel()">Фільтри</button>
    </div>

    <!-- Filter Panel -->
    <div class="filter-panel" id="filterPanel">
        <div class="filter-grid">
            <div class="filter-item">
                <label>Тип товару</label>
                <select id="filterCategory" onchange="updateSizesList()">
                    <option value="">Всі типи</option>
                    <option value="Одяг">Одяг</option>
                    <option value="Взуття">Взуття</option>
                    <option value="Аксесуари">Аксесуари</option>
                </select>
            </div>
            <div class="filter-item">
                <label>Бренд</label>
                <select id="filterBrand">
                    <option value="">Всі бренди</option>
                    <option value="Nike">Nike</option>
                    <option value="Adidas">Adidas</option>
                    <option value="Puma">Puma</option>
                    <option value="New Balance">New Balance</option>
                </select>
            </div>
            <div class="filter-item">
                <label>Розмір</label>
                <select id="filterSize">
                    <option value="">Будь-який розмір</option>
                </select>
            </div>
        </div>
        <div class="filter-actions">
            <span id="productCounter" style="font-weight: 600;">Знайдено товарів: 0</span>
            <div>
                <button class="btn-reset" onclick="resetFilters()">Скинути</button>
                <button class="btn-apply" onclick="applyFilters()">Застосувати (<span id="applyCounter">0</span>)</button>
            </div>
        </div>
    </div>

    <!-- Products Section -->
    <main class="container">
        <div class="products-grid" id="productsGrid">
            <!-- Products will be loaded from Supabase -->
        </div>
    </main>

    <!-- Drawer Settings Sidebar -->
    <div class="drawer" id="settingsDrawer">
        <div class="drawer-header">
            <span>Налаштування</span>
            <button class="close-drawer" onclick="toggleDrawer()">×</button>
        </div>
        <div class="settings-group">
            <label>Мова / Language</label>
            <select id="langSelect">
                <option value="ua">Українська</option>
                <option value="ru">Русский</option>
                <option value="en">English</option>
                <option value="de">Deutsch</option>
            </select>
        </div>
        <div class="settings-group">
            <label>Тема оформлення</label>
            <select id="themeSelect" onchange="changeTheme(this.value)">
                <option value="dark">Тёмная (Telegram/YouTube)</option>
                <option value="grey">Серая</option>
                <option value="light">Светлая</option>
            </select>
        </div>
    </div>

    <script>
        // Supabase configuration
        const supabaseUrl = 'https://bxqfolxpnxlsmsuleq.supabase.co';
        const supabaseKey = 'sb_publishable_D4IyQCa0sNLO44YWVmRvYw_E1lRCAPF';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let allProducts = [];

        // Generate sizes from 35 to 46.5
        function initSizes() {
            const sizeSelect = document.getElementById('filterSize');
            for (let i = 35; i <= 46.5; i += 0.5) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i;
                sizeSelect.appendChild(opt);
            }
            // Add clothing sizes too
            ['XS', 'S', 'M', 'L', 'XL', 'XXL'].forEach(s => {
                let opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                sizeSelect.appendChild(opt);
            });
        }

        async function fetchProducts() {
            const { data, error } = await supabaseClient.from('products').select('*');
            if (error) {
                console.error('Помилка завантаження:', error);
                return;
            }
            allProducts = data || [];
            renderProducts(allProducts);
            updateCounters(allProducts.length);
        }

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            if (products.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding: 40px;">Товарів не знайдено</p>';
                return;
            }

            products.forEach(p => {
                let imgUrl = p.images && p.images.length > 0 ? p.images[0] : 'https://via.placeholder.com/250';
                let card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${imgUrl}" alt="${p.title}" class="product-img">
                    <div class="product-info">
                        <div class="product-brand">${p.brand || ''}</div>
                        <div class="product-title">${p.title}</div>
                        <div class="product-price">${p.price} грн</div>
                        ${p.tg_link ? `<a href="${p.tg_link}" target="_blank" class="product-tg-btn">Telegram замовлення</a>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleDrawer() {
            document.getElementById('settingsDrawer').classList.toggle('open');
        }

        function toggleFilterPanel() {
            document.getElementById('filterPanel').classList.toggle('active');
        }

        function changeTheme(theme) {
            document.body.setAttribute('data-theme', theme);
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => 
                (p.title && p.title.toLowerCase().includes(query)) || 
                (p.brand && p.brand.toLowerCase().includes(query))
            );
            renderProducts(filtered);
            updateCounters(filtered.length);
        }

        function updateCounters(count) {
            document.getElementById('productCounter').textContent = `Знайдено товарів: ${count}`;
            document.getElementById('applyCounter').textContent = count;
        }

        function applyFilters() {
            const cat = document.getElementById('filterCategory').value;
            const brand = document.getElementById('filterBrand').value;
            const size = document.getElementById('filterSize').value;

            const filtered = allProducts.filter(p => {
                let matchCat = !cat || (p.category && p.category === cat);
                let matchBrand = !brand || (p.brand && p.brand === brand);
                let matchSize = !size || (p.sizes && p.sizes.includes(size));
                return matchCat && matchBrand && matchSize;
            });

            renderProducts(filtered);
            updateCounters(filtered.length);
        }

        function resetFilters() {
            document.getElementById('filterCategory').value = '';
            document.getElementById('filterBrand').value = '';
            document.getElementById('filterSize').value = '';
            document.getElementById('searchInput').value = '';
            renderProducts(allProducts);
            updateCounters(allProducts.length);
        }

        window.onload = () => {
            initSizes();
            fetchProducts();
        };
    </script>
</body>
</html>
